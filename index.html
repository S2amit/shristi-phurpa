        @keyframes fadeIn {
          from { opacity: 0; }
          to   { opacity: 1; }

          from { transform: scaleX(0); }

        .splash-btn    { animation: fadeUp 1s ease 1.6s both; }
        .splash-fade-out { animation: splashOut 1s ease forwards; }

          from { opacity: 1; transform: scale(1); }

          cursor: pointer;
          background: none;
          border: none;
          padding: 0 0 8px 0;

        }

          content: '';
          position: absolute;
          bottom: 0; left: 0; right: 0;
          height: 1px;
